<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ban Widget V4</title>
<style>
:root{--cell-w:331px;--cell-h:310px;--edge:28px;--stack-gap:18px;--stack-scale:.333333;--stack-h:103.333px;--ink:#111;--gold:#ffd72f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;pointer-events:none}
.cell{position:absolute;width:var(--cell-w);height:var(--cell-h);left:50%;top:45%;transform:translate(-50%,-50%);z-index:20;filter:drop-shadow(0 18px 12px #0008)}
.cell .avatar{position:absolute;z-index:2;left:37px;top:42px;width:258px;height:227px;object-fit:cover;border-radius:50%;background:#182028}
.cell .frame{position:absolute;inset:0;width:331px;height:310px;object-fit:fill;z-index:5;pointer-events:none}
.cell .bars{position:absolute;z-index:4;left:37px;top:40px;width:258px;height:231px;overflow:hidden;pointer-events:none}
.cell .bar{position:absolute;top:0;height:231px;width:12px;opacity:1;transform:scaleY(1);transform-origin:top center;background:linear-gradient(90deg,#050505 0%,#2d2d2d 22%,#8a8a8a 43%,#242424 61%,#050505 100%);border:2px solid #030303;border-radius:2px;box-shadow:3px 0 4px rgba(0,0,0,.75),inset 1px 0 1px rgba(255,255,255,.35)}
.cell .bar::after{content:"";position:absolute;left:2px;right:2px;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 28%,transparent 72%,rgba(0,0,0,.28))}
.cell .bar:nth-child(1){left:23px}.cell .bar:nth-child(2){left:56px}.cell .bar:nth-child(3){left:90px}.cell .bar:nth-child(4){left:123px}.cell .bar:nth-child(5){left:157px}.cell .bar:nth-child(6){left:190px}.cell .bar:nth-child(7){left:224px}
.cell:not(.locking):not(.locked) .bar{transform:scaleY(0)}
.cell.locking .bar{animation:barsDown 1.5s cubic-bezier(.25,.8,.25,1) forwards}
@keyframes barsDown{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cell.releasing .bar{animation:barsUp 1.25s ease-in forwards}
@keyframes barsUp{from{transform:scaleY(1)}to{transform:scaleY(0)}}
.timer{position:absolute;z-index:10;left:50%;top:9%;transform:translateX(-50%);width:108px;height:38px;padding:5px 8px;background:#111;color:#efff00;border:3px solid var(--gold);border-radius:7px;box-shadow:0 3px 0 #0009;text-align:center;font:900 17px monospace}
.nameplate{position:absolute;z-index:10;left:18%;right:18%;bottom:21%;height:9%;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;background:linear-gradient(#3a3a3a,#151515);border:3px solid var(--gold);border-radius:6px;box-shadow:0 4px 0 #0008;color:#fff;text-shadow:0 2px 2px #000;font:1000 15px Arial,sans-serif;padding:0 8px}
.nameplate span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.reason{position:absolute;z-index:10;left:16%;right:16%;bottom:8%;height:12%;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;background:linear-gradient(#f2d681,#c49a3d);border:4px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 #0008;color:#111;font:1000 14px Arial,sans-serif}
.reason span{display:block;white-space:nowrap}.reason.scrolling{justify-content:flex-start}.reason.scrolling span{min-width:max-content;padding-left:100%;animation:reasonScroll var(--scroll-time,7s) linear infinite}@keyframes reasonScroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.cell.docked{left:auto;top:auto;right:var(--edge);bottom:var(--edge);transform:scale(var(--stack-scale));transform-origin:bottom right;animation:dockIn .5s cubic-bezier(.2,.9,.2,1) forwards}
.cell.stack1{bottom:calc(var(--edge) + var(--stack-h) + var(--stack-gap))}.cell.stack2{bottom:calc(var(--edge) + 2 * (var(--stack-h) + var(--stack-gap)))}.cell.stack3{bottom:calc(var(--edge) + 3 * (var(--stack-h) + var(--stack-gap)))}
@keyframes dockIn{from{opacity:0;transform:translate(170px,130px) scale(.65)}to{opacity:1;transform:scale(var(--stack-scale))}}
.cell.releasing .avatar{animation:avatarOut .7s cubic-bezier(.2,.8,.2,1) .08s forwards}.cell.releasing .timer,.cell.releasing .nameplate,.cell.releasing .reason{animation:fade .28s ease forwards}.cell.releasing{animation:removeInPlace .75s .5s ease forwards}
@keyframes avatarOut{0%{transform:translateY(0) scale(1);opacity:1}55%{transform:translateY(-45px) scale(1.04);opacity:1}100%{transform:translateY(-170px) scale(.78);opacity:0}}
@keyframes fade{to{opacity:0}}@keyframes removeInPlace{to{opacity:0;transform:scale(.82)}}
.ban-scene{position:absolute;inset:0;overflow:hidden;z-index:60}
.truck{position:absolute;left:-700px;bottom:7%;width:640px;height:320px;background:url("assets/jail-truck-black-window.png") center/100% 100% no-repeat;animation:truckDriveIn 1.8s cubic-bezier(.18,.62,.1,1) forwards;filter:drop-shadow(0 18px 10px #0008)}
.truck.driving-off{animation:truckDriveOff 3s linear forwards}
.truck-window{position:absolute;left:40.3%;top:22.8%;width:14.26%;height:27.73%;z-index:2;overflow:hidden;opacity:0}.truck-window.visible{opacity:1}
.truck-avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2px;z-index:1}
.truck-bars{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.truck-bars i{position:absolute;top:0;bottom:0;width:7%;background:linear-gradient(90deg,#050505,#686868 34%,#111 62%,#020202);border:1px solid #050505;box-shadow:1px 0 2px rgba(0,0,0,.75);transform:scaleY(0);transform-origin:top center}
.truck-bars i:nth-child(1){left:2%}.truck-bars i:nth-child(2){left:17%}.truck-bars i:nth-child(3){left:32%}.truck-bars i:nth-child(4){left:47%}.truck-bars i:nth-child(5){left:62%}.truck-bars i:nth-child(6){left:77%}.truck-bars i:nth-child(7){left:92%}
.ban-skid{position:absolute;z-index:1;left:50%;bottom:13%;width:390px;height:92px;transform:translateX(-50%) rotate(-2deg);opacity:0;pointer-events:none}
.ban-skid::before,.ban-skid::after{content:"";position:absolute;top:26px;width:165px;height:34px;border-radius:50% 18% 42% 12%;background:linear-gradient(180deg,rgba(20,20,20,.12),rgba(10,10,10,.72) 38%,rgba(0,0,0,.5) 70%,rgba(0,0,0,0));filter:blur(2px)}
.ban-skid::before{left:22px;transform:rotate(3deg)}.ban-skid::after{right:22px;transform:rotate(-3deg)}
.ban-skid.active{animation:skidReveal .45s ease-out forwards}
@keyframes skidReveal{from{opacity:0;transform:translateX(-50%) rotate(-2deg) scaleX(.65)}to{opacity:1;transform:translateX(-50%) rotate(-2deg) scaleX(1)}}
.ban-reason{position:absolute;z-index:3;left:50%;bottom:15%;width:min(620px,82vw);min-height:54px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;padding:10px 20px;color:#fff;text-align:center;text-shadow:0 3px 4px #000,0 0 8px #000;font:900 22px Arial,Helvetica,sans-serif;opacity:0;overflow:hidden}
.ban-reason span{display:block;white-space:nowrap;max-width:100%}.ban-reason.scrolling{justify-content:flex-start}.ban-reason.scrolling span{min-width:max-content;padding-left:100%;animation:banReasonScroll var(--ban-scroll-time,8s) linear infinite}
@keyframes banReasonScroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ban-reason.show{animation:banReasonIn .35s ease-out forwards}.ban-reason.fade-out{animation:banReasonOut .8s ease forwards}
@keyframes banReasonIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes banReasonOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
@keyframes truckDriveIn{0%{transform:translateX(0)}100%{transform:translateX(1020px)}}
@keyframes truckDriveOff{0%{transform:translateX(1020px)}100%{transform:translateX(calc(100vw + 700px))}}
.court{position:absolute;z-index:80;left:50%;top:74%;transform:translate(-50%,-50%) scale(.8);opacity:0;background:#f0dfb8;border:5px solid #111;border-radius:10px;padding:9px 20px;text-align:center;color:#111;box-shadow:0 9px 0 #0005}.court.show{animation:courtIn .4s cubic-bezier(.2,1.3,.3,1) forwards}.court .small{font:900 11px Arial;letter-spacing:2px}.court .big{font:1000 24px Impact,Arial}@keyframes courtIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#status{position:absolute;left:14px;top:14px;z-index:100;background:#000b;color:#fff;padding:6px 9px;border-radius:5px;font:700 11px monospace;opacity:0;transition:opacity .2s}#status.show{opacity:1}
</style>
</head>
<body><div id="stage"></div><div id="status"></div>
<script>
const CFG={host:"127.0.0.1",port:8080,reconnectMs:3000,sounds:true,maxDocked:4};const stage=document.getElementById("stage"),status=document.getElementById("status");const active=new Map();let audio=null;let barSound=null;let lockQueue=[];let lockBusy=false;
const BAR_SOUND="assets/audio/395920__locontrario23__closing-door.wav";
const rootStyle=document.documentElement.style;
function updateStackSize(){const scale=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stack-scale"))||.333333;rootStyle.setProperty("--stack-h",(310*scale)+"px")}
updateStackSize();
function say(s){status.textContent=s;status.classList.add("show");clearTimeout(status.t);status.t=setTimeout(()=>status.classList.remove("show"),1200)}
function unlock(){if(!CFG.sounds)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();if(!barSound){barSound=new Audio(BAR_SOUND);barSound.preload="auto";barSound.load()}}
function tone(f,d,t="square",g=.04,delay=0){if(!CFG.sounds)return;unlock();if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(g,audio.currentTime+delay);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+d);o.connect(a).connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+d+.03)}
function clang(){if(!CFG.sounds)return Promise.resolve();unlock();if(!barSound)return Promise.resolve();barSound.currentTime=0;barSound.volume=.85;return new Promise(resolve=>{let done=false,timeoutId=null;const finish=()=>{if(done)return;done=true;barSound.removeEventListener("ended",finish);barSound.removeEventListener("error",finish);barSound.removeEventListener("loadedmetadata",setFallback);if(timeoutId)clearTimeout(timeoutId);resolve()};const setFallback=()=>{if(!Number.isFinite(barSound.duration)||barSound.duration<=0)return;timeoutId=setTimeout(finish,Math.ceil(barSound.duration*1000)+250)};barSound.addEventListener("ended",finish,{once:true});barSound.addEventListener("error",finish,{once:true});barSound.addEventListener("loadedmetadata",setFallback,{once:true});if(Number.isFinite(barSound.duration)&&barSound.duration>0)setFallback();const p=barSound.play();if(p)p.catch(()=>{say("CLICK TO ENABLE SOUND");finish()})})}
function releaseSound(){tone(520,.08,"triangle",.03)}
function siren(){tone(650,.18,"sawtooth",.025);tone(900,.18,"sawtooth",.025,.19);tone(650,.18,"sawtooth",.025,.38);tone(900,.18,"sawtooth",.025,.57)}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function key(d){return d.id||d.username||d.displayName||crypto.randomUUID()}
function setName(e,text){const span=e.querySelector(".nameplate span");span.textContent=text||"UNKNOWN USER"}
function setReason(e,text){const box=e.querySelector(".reason"),span=box.querySelector("span");span.textContent=text||"TIMEOUT";requestAnimationFrame(()=>{box.classList.remove("scrolling");span.style.removeProperty("--scroll-time");if(span.scrollWidth>box.clientWidth){const sec=Math.max(5,Math.min(14,span.scrollWidth/35));box.style.setProperty("--scroll-time",sec+"s");box.classList.add("scrolling")}})}
function setBanReason(scene,text){const box=scene.querySelector(".ban-reason"),span=box.querySelector("span");span.textContent=text||"BANNED";box.classList.remove("scrolling");span.style.removeProperty("--ban-scroll-time");requestAnimationFrame(()=>{if(span.scrollWidth>box.clientWidth){const sec=Math.max(6,Math.min(16,span.scrollWidth/42));box.style.setProperty("--ban-scroll-time",sec+"s");box.classList.add("scrolling")}})}
function createCell(d){const e=document.createElement("div");e.className="cell";e.innerHTML=`<img class="avatar" alt=""><div class="bars"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><img class="frame" src="assets/cell_frame_final.png" alt=""><div class="timer">00:00</div><div class="nameplate"><span></span></div><div class="reason"><span></span></div>`;const avatar=e.querySelector(".avatar");avatar.src=d.avatar||"";avatar.onerror=()=>{avatar.style.opacity=".12"};setName(e,d.displayName||d.username||d.login||"UNKNOWN USER");setReason(e,d.reason||d.timeoutReason||d.message||"TIMEOUT");return e}
function restack(){const cards=[...stage.querySelectorAll(".cell.docked")];cards.forEach((x,i)=>{x.classList.remove("stack1","stack2","stack3");if(i>0)x.classList.add("stack"+Math.min(i,3))})}
function dockSameCell(e){e.classList.remove("locking");e.classList.add("locked");e.classList.add("docked");restack();const cards=[...stage.querySelectorAll(".cell.docked")];if(cards.length>CFG.maxDocked){const oldest=cards[0];const ent=[...active.entries()].find(([,v])=>v.el===oldest);if(ent)release(ent[0])}}
function processLockQueue(){if(lockBusy||!lockQueue.length)return;const item=lockQueue.shift();const current=active.get(item.k);if(!current||current.item!==item){processLockQueue();return}lockBusy=true;const duration=Math.max(1,Number(item.d.duration)||1);const e=createCell(item.d);stage.appendChild(e);active.set(item.k,{el:e,end:Date.now()+duration*1000,type:"timeout"});e.classList.add("locking");const tick=()=>{const x=active.get(item.k);if(!x||x.el!==e)return;const left=(x.end-Date.now())/1000;e.querySelector(".timer").textContent=fmt(left);if(left<=0){release(item.k);return}requestAnimationFrame(tick)};tick();const animationDone=new Promise(resolve=>setTimeout(resolve,1500));const soundDone=clang();Promise.all([animationDone,soundDone]).then(()=>{const x=active.get(item.k);if(x?.el===e){dockSameCell(e)}lockBusy=false;processLockQueue()})}
function timeout(d){unlock();const k=key(d);if(active.has(k))release(k);const item={d,k};active.set(k,{item,type:"timeout"});lockQueue.push(item);processLockQueue()}
function release(k){const x=active.get(k);if(!x)return;if(x.item&&!x.el){x.item.cancelled=true;active.delete(k);lockQueue=lockQueue.filter(i=>i!==x.item);processLockQueue();return}if(!x.el)return;x.el.classList.remove("docked","stack1","stack2","stack3");x.el.classList.add("releasing");releaseSound();setTimeout(()=>{x.el.remove();active.delete(k);restack()},1250)}
function ban(d){unlock();const k=key(d);if(active.has(k))release(k);const scene=document.createElement("div");scene.className="ban-scene";scene.innerHTML=`<div class="ban-skid"></div><div class="truck"><div class="truck-window"><img class="truck-avatar" src="${d.avatar||""}" alt=""><div class="truck-bars">${Array.from({length:7},()=>"<i></i>").join("")}</div></div></div><div class="ban-reason"><span></span></div>`;stage.appendChild(scene);const truck=scene.querySelector(".truck"),windowEl=scene.querySelector(".truck-window"),bars=[...scene.querySelectorAll(".truck-bars i")],skid=scene.querySelector(".ban-skid");active.set(k,{scene,type:"ban"});setBanReason(scene,d.reason||d.banReason||d.message||"BANNED");
const driveInDone=new Promise(resolve=>setTimeout(resolve,1800));driveInDone.then(()=>{if(active.get(k)?.scene!==scene)return;windowEl.classList.add("visible");setTimeout(()=>{if(active.get(k)?.scene!==scene)return;bars.forEach(bar=>{bar.style.transition="transform 1.5s cubic-bezier(.25,.8,.25,1)";bar.style.transform="scaleY(1)"});clang().then(()=>{if(active.get(k)?.scene!==scene)return;skid.classList.add("active");truck.classList.add("driving-off");siren();setTimeout(()=>{if(active.get(k)?.scene!==scene)return;const reason=scene.querySelector(".ban-reason");reason.classList.add("show");setTimeout(()=>{reason.classList.add("fade-out");setTimeout(()=>{scene.remove();active.delete(k)},850)},4000)},3000)})},100)});
}
function handle(d){if(typeof d==="string"){try{d=JSON.parse(d)}catch{return}}if(d?.data&&typeof d.data==="string"){try{d=JSON.parse(d.data)}catch{}}if(d?.data&&!d.action&&!d.type)d=d.data;if(d?.payload)d=d.payload;if(!d||typeof d!=="object")return;const a=(d.action||d.type||"").toLowerCase();if(a==="timeout"||a==="timedout"||a==="timed-out")timeout(d);else if(a==="ban"||a==="banned")ban(d)}
function nativeHandle(m){const src=(m.event?.source||"").toLowerCase(),typ=(m.event?.type||"").toLowerCase(),d=m.data||{};if(src!=="twitch")return;const u=d.targetUser||{};if(typ==="usertimedout")timeout({action:"timeout",id:u.id,username:u.login,displayName:u.name,avatar:u.profileImageUrl||"",duration:d.duration,reason:d.reason||d.timeoutReason||"TIMEOUT"});if(typ==="userbanned")ban({action:"ban",id:u.id,username:u.login,displayName:u.name,avatar:u.profileImageUrl||"",reason:d.reason||d.banReason||d.message||"BANNED"});if(typ==="useruntimedout")release(u.id||u.login)}
function connect(){const ws=new WebSocket(`ws://${CFG.host}:${CFG.port}/`);ws.onopen=()=>{say("BAN WIDGET V4 ONLINE");ws.send(JSON.stringify({request:"Subscribe",id:"ban-widget-v4",events:{General:["Custom"],Twitch:["UserTimedOut","UserBanned","UserUntimedBanned"]}}))};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event?.source==="General"&&m.event?.type==="Custom")handle(m.data?.data??m.data);else nativeHandle(m)}catch(err){console.warn(err)}};ws.onclose=()=>setTimeout(connect,CFG.reconnectMs);ws.onerror=()=>ws.close()}
function demoTimeout(name="DEMO_VIEWER",duration=59,reason="BACKSEAT GAMING"){timeout({action:"timeout",id:name,username:name,displayName:name,avatar:"https://static-cdn.jtvnw.net/jtv_user_pictures/xarth/404_user_70x70.png",duration,reason})}function demoStack(){[["ALPHA","NO SPOILERS"],["BRAVO","BACKSEAT GAMING"],["CHARLIE","BE RESPECTFUL"],["DELTA","NO CAPS"]].forEach((x,i)=>setTimeout(()=>demoTimeout(x[0],75+i*15,x[1]),i*700))}function demoLong(){demoTimeout("LONG_MESSAGE",59,"PLEASE RESPECT EVERYONE IN CHAT AND KEEP IT POSITIVE AND FOLLOW THE RULES")}function demoBan(){ban({action:"ban",id:"DEMO_BANNED",username:"DEMO_BANNED",displayName:"DEMO_BANNED",avatar:"https://static-cdn.jtvnw.net/jtv_user_pictures/xarth/404_user_70x70.png",reason:"Repeated backseat gaming after multiple warnings"})}
window.testTimeout=demoTimeout;window.testStack=demoStack;window.testLong=demoLong;window.testBan=demoBan;const q=new URLSearchParams(location.search);if(q.get("test")==="timeout")setTimeout(demoTimeout,300);if(q.get("test")==="stack")setTimeout(demoStack,300);if(q.get("test")==="long")setTimeout(demoLong,300);if(q.get("test")==="ban")setTimeout(demoBan,300);document.addEventListener("pointerdown",unlock,{once:true});connect();
</script>
</body>
</html>
