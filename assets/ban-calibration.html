<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ban Truck Calibration</title>
  <style>
    :root { --truck-x: 520px; --truck-y: 220px; --skid-x: 520px; --skid-y: 410px; --banned-x: 285px; --banned-y: 205px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #202124; color: #eee; font: 14px Arial,sans-serif; overflow: hidden; }
    .toolbar { position: fixed; z-index: 10; inset: 0 0 auto 0; padding: 12px; background: rgba(25,25,25,.96); border-bottom: 1px solid #555; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .toolbar label { display:flex; gap:6px; align-items:center; }
    .toolbar input { width:82px; background:#111; color:#fff; border:1px solid #666; padding:5px; }
    .toolbar button { background:#444; color:#fff; border:1px solid #777; padding:6px 10px; cursor:pointer; }
    .hint { opacity:.75; }
    #canvas { position: absolute; left:0; right:0; top:64px; bottom:0; overflow:hidden; background:repeating-linear-gradient(0deg,#222 0,#222 39px,#292929 40px),repeating-linear-gradient(90deg,transparent 0,transparent 39px,rgba(255,255,255,.08) 40px); }
    #truck { position:absolute; left:var(--truck-x); top:var(--truck-y); width:590px; user-select:none; pointer-events:none; }
    #skids { position:absolute; left:var(--skid-x); top:var(--skid-y); width:190px; height:12px; pointer-events:none; }
    .skid { position:absolute; width:190px; height:5px; background:#9146ff; box-shadow:0 0 5px #9146ff; }
    .skid:nth-child(2) { top:8px; }
    #banned { position:absolute; left:var(--banned-x); top:var(--banned-y); padding:2px 5px; font-weight:700; color:#9146ff; background:rgba(0,0,0,.25); white-space:nowrap; pointer-events:none; }
    .marker { position:absolute; width:10px; height:10px; margin:-5px; border:1px solid #fff; border-radius:50%; box-shadow:0 0 0 1px #000; pointer-events:none; }
    #backMarker { left:var(--truck-x); top:calc(var(--truck-y) + 220px); background:#f44; }
    #skidMarker { left:var(--skid-x); top:var(--skid-y); background:#4af; }
    #bannedMarker { left:var(--banned-x); top:var(--banned-y); background:#4f4; }
    #readout { position:fixed; z-index:11; right:10px; bottom:10px; padding:10px; background:rgba(0,0,0,.8); border:1px solid #555; font-family:Consolas,monospace; white-space:pre; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Ban Truck Calibration</strong>
    <label>Truck X <input id="tx" type="number" value="520"></label>
    <label>Truck Y <input id="ty" type="number" value="220"></label>
    <label>Skid X <input id="sx" type="number" value="520"></label>
    <label>Skid Y <input id="sy" type="number" value="410"></label>
    <label>Banned X <input id="bx" type="number" value="285"></label>
    <label>Banned Y <input id="by" type="number" value="205"></label>
    <button id="copy">Copy values</button>
    <span class="hint">Use DevTools to fine-tune positions. Red = truck rear, blue = skid start, green = banned.</span>
  </div>
  <div id="canvas">
    <img id="truck" src="truck_full.png" alt="Truck">
    <div id="skids"><div class="skid"></div><div class="skid"></div></div>
    <div id="banned">BANNED:</div>
    <div id="backMarker" class="marker"></div>
    <div id="skidMarker" class="marker"></div>
    <div id="bannedMarker" class="marker"></div>
  </div>
  <pre id="readout"></pre>
  <script>
    const ids=['tx','ty','sx','sy','bx','by'];
    function update(){
      const v=Object.fromEntries(ids.map(id=>[id,Number(document.getElementById(id).value)||0]));
      document.documentElement.style.setProperty('--truck-x',v.tx+'px');
      document.documentElement.style.setProperty('--truck-y',v.ty+'px');
      document.documentElement.style.setProperty('--skid-x',v.sx+'px');
      document.documentElement.style.setProperty('--skid-y',v.sy+'px');
      document.documentElement.style.setProperty('--banned-x',v.bx+'px');
      document.documentElement.style.setProperty('--banned-y',v.by+'px');
      document.getElementById('readout').textContent=`Truck:  left:${v.tx}px  top:${v.ty}px\nSkids:  left:${v.sx}px  top:${v.sy}px\nBanned: left:${v.bx}px  top:${v.by}px`;
    }
    ids.forEach(id=>document.getElementById(id).addEventListener('input',update));
    document.getElementById('copy').onclick=async()=>{
      const t=document.getElementById('readout').textContent;
      await navigator.clipboard.writeText(t);
      document.getElementById('copy').textContent='Copied';
      setTimeout(()=>document.getElementById('copy').textContent='Copy values',1000);
    };
    update();
  </script>
</body>
</html>
