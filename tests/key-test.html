<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Key Positioning Test</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="../assets/platform-colors.css" />
  <link rel="stylesheet" href="../assets/ban-platform.css" />
  <link rel="stylesheet" href="../assets/ban-positioning.css" />
  <link rel="stylesheet" href="../assets/timeout-bars.css" />
  <link rel="stylesheet" href="../assets/stack-visibility.css" />
  <link rel="stylesheet" href="../assets/timeout-key.css" />
  <link rel="stylesheet" href="key-test.css" />
</head>
<body>
  <div id="key-test-controls" class="key-test-controls">
    <h1>Key Positioning Test</h1>
    <label>
      X Position
      <input id="key-test-x" type="range" min="-500" max="500" value="-90" step="1">
      <output id="key-test-x-value">-90px</output>
    </label>
    <label>
      Y Position
      <input id="key-test-y" type="range" min="-300" max="300" value="96" step="1">
      <output id="key-test-y-value">96px</output>
    </label>
    <div class="key-test-actions">
      <button id="key-test-reset" type="button">Reset</button>
      <button id="key-test-copy" type="button">Copy Values</button>
    </div>
    <pre id="key-test-output">--key-test-x: -90px;
--key-test-y: 96px;</pre>
  </div>

  <div id="stage"></div>
  <div id="status"></div>
  <script src="../assets/stack-visibility.js"></script>
  <script src="../assets/stack-capacity.js"></script>
  <script src="../assets/timeout-key.js"></script>
  <script src="../assets/script.js"></script>
  <script src="key-test.js"></script>
</body>
</html>
