name: Split widget files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          style_open = html.index('<style>') + len('<style>')
          style_close = html.index('</style>', style_open)
          script_open = html.index('<script>') + len('<script>')
          script_close = html.index('</script>', script_open)

          style = html[style_open:style_close].strip() + '\n'
          script = html[script_open:script_close].strip() + '\n'

          Path('assets/style.css').parent.mkdir(parents=True, exist_ok=True)
          Path('assets/style.css').write_text(style, encoding='utf-8')
          Path('assets/script.js').write_text(script, encoding='utf-8')

          html = html[:style_open-len('<style>')] + '<link rel="stylesheet" href="assets/style.css">' + html[style_close+len('</style>'):]
          script_open = html.index('<script>')
          script_close = html.index('</script>', script_open) + len('</script>')
          html = html[:script_open] + '<script src="assets/script.js"></script>' + html[script_close:]
          p.write_text(html, encoding='utf-8')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/split-widget.yml

      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/style.css assets/script.js .github/workflows/split-widget.yml
          git diff --cached --quiet && exit 0
          git commit -m "Split widget into standard files"
          git push
