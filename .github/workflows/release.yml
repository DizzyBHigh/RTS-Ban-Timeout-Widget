name: Build and Release Overlay

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package overlay and create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('RTS-release.json'))['version'])")
          PRODUCT=$(python -c "import json; print(json.load(open('RTS-release.json'))['product'])")
          ZIP_NAME=$(python -c "import json; print(json.load(open('RTS-release.json'))['overlay']['zipName'])")
          SITE_PATH=$(python -c "import json; print(json.load(open('RTS-release.json'))['overlay']['sitePath'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "site_path=$SITE_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches release metadata
        shell: bash
        run: |
          EXPECTED="v${{ steps.metadata.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match RTS-release.json version $EXPECTED"
            exit 1
          fi

      - name: Build overlay package
        shell: bash
        run: |
          mkdir -p build/overlay
          cp index.html build/overlay/
          cp -R assets build/overlay/assets
          cd build
          zip -r "${{ steps.metadata.outputs.zip_name }}" overlay >/dev/null

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.metadata.outputs.product }} v${{ steps.metadata.outputs.version }}"
          generate_release_notes: true
          files: |
            build/${{ steps.metadata.outputs.zip_name }}
            RTS-release.json
            SB Import Code.txt

  publish-site:
    name: Publish public overlay to RTS website
    needs: release
    runs-on: ubuntu-latest
    env:
      WEBSITE_TOKEN: ${{ secrets.RTS_WEBSITE_TOKEN }}

    steps:
      - name: Check whether website publishing is configured
        id: token
        shell: bash
        run: |
          if [ -n "$WEBSITE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RTS_WEBSITE_TOKEN is not configured; website publishing will be skipped."
          fi

      - name: Check out extension
        if: ${{ steps.token.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Read release metadata
        if: ${{ steps.token.outputs.configured == 'true' }}
        id: metadata
        shell: bash
        run: |
          SITE_PATH=$(python -c "import json; print(json.load(open('RTS-release.json'))['overlay']['sitePath'])")
          VERSION=$(python -c "import json; print(json.load(open('RTS-release.json'))['version'])")
          echo "site_path=$SITE_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out public website
        if: ${{ steps.token.outputs.configured == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: DizzyBHigh/road-to-somewhere
          token: ${{ secrets.RTS_WEBSITE_TOKEN }}
          path: website

      - name: Publish online overlay
        if: ${{ steps.token.outputs.configured == 'true' }}
        shell: bash
        run: |
          DEST="website${{ steps.metadata.outputs.site_path }}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp index.html "$DEST/"
          cp -R assets "$DEST/assets"

          PRODUCT_DIR="website/extensions/rts-ban-timeout-widget"
          mkdir -p "$PRODUCT_DIR"
          cp RTS-release.json "$PRODUCT_DIR/RTS-release.json"
          cp "SB Import Code.txt" "$PRODUCT_DIR/streamerbot-import.txt"

      - name: Commit website update
        if: ${{ steps.token.outputs.configured == 'true' }}
        shell: bash
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/rts-ban-timeout-widget
          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git commit -m "Publish RTS Ban / Timeout Widget v${{ steps.metadata.outputs.version }}"
          git push
