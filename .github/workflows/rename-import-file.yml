name: Rename versioned import file

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'chore: rename versioned Streamer.bot import file'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename import file
        run: |
          set -euo pipefail
          old='SB Import Code.txt'
          new='RTS Ban Timeout Widget v1.0.0 - Import Code.txt'
          if [ -f "$old" ]; then
            git mv "$old" "$new"
          elif [ -f "$new" ]; then
            echo "Versioned import file already exists."
          else
            echo "Import file not found."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rename versioned Streamer.bot import file'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/rename-import-file.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary rename workflow' || true
          git push || true
