name: One-time typo fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix event name
        run: |
          sed -i 's/UserUntimedBanned/UserUntimedOut/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git add index.html
          git commit -m 'Fix UserUntimedOut event subscription'
          git push
